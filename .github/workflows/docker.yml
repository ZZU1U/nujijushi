name: Docker

on:
  push:
    branches: [main]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: nujijushi:smoke
          cache-from: type=gha,scope=nujijushi-docker
      - name: Test the Compose deployment
        env:
          NUJIJUSHI_IMAGE: nujijushi:smoke
        run: |
          cleanup() {
            if [ "$?" -ne 0 ]; then
              docker compose logs nujijushi || true
            fi
            docker compose down
          }
          trap cleanup EXIT
          sudo install -d -m 0700 -o 10001 -g 10001 data
          docker compose run --rm -T nujijushi init >/dev/null
          docker compose run --rm -T nujijushi doctor --offline
          docker compose up -d --pull never
          curl --fail --silent --show-error --retry 10 --retry-connrefused --max-time 5 \
            http://127.0.0.1:8788/login -o "$RUNNER_TEMP/nujijushi-login.html"
          grep -Fq '/admin-assets/' "$RUNNER_TEMP/nujijushi-login.html"
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Choose image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern=v{{version}}
      - name: Publish the multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nujijushi-docker
          cache-to: type=gha,scope=nujijushi-docker,mode=max,ignore-error=true
