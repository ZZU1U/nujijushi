<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nujijushi clip</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header>
      <h1>nujijushi clip</h1>
      <div class="tools">
        <span id="count" class="count">0</span>
        <button id="open-options" class="ghost icon" type="button" title="Settings" aria-label="Open extension options">⚙</button>
      </div>
    </header>

    <main>
      <ul id="list"></ul>
      <p id="empty" class="empty">
        Nothing clipped yet. Click the <b>+</b> next to a post, right-click a link, or press
        <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>L</kbd> on a post page.
      </p>
    </main>

    <footer>
      <div class="actions">
        <button id="copy" class="primary" type="button" disabled>copy</button>
        <button id="copy-all" class="ghost" type="button" hidden>copy all</button>
        <button id="clear" class="ghost" type="button" disabled>clear</button>
      </div>
      <details id="watch-box">
        <summary>Watch artist</summary>
        <form id="watch-form" class="panel-form">
          <button id="watch-tab" type="button">Use current tab</button>
          <label for="watch-url">Artist profile URL</label>
          <input id="watch-url" type="url" required spellcheck="false">
          <label for="watch-name">Watch name</label>
          <input id="watch-name" required maxlength="100">
          <label for="watch-batch">Initial posts</label>
          <input id="watch-batch" type="number" min="1" max="100" step="1" required value="10">
          <button type="submit">Add watch</button>
        </form>
      </details>
      <details id="paste-box">
        <summary>paste links</summary>
        <textarea id="paste" rows="4" spellcheck="false" placeholder="one link per line, or any blob of text"></textarea>
        <button id="paste-add" class="ghost" type="button">add</button>
      </details>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </footer>

    <script src="lib/canonical.js"></script>
    <script src="lib/store.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
