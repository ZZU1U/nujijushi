# nujijushi configuration — copy to $NUJIJUSHI_HOME/config.toml (default ~/.nujijushi/config.toml)
# See .env.example for environment overrides.

[telegram]
# From @BotFather. The bot must be an administrator of every channel it posts to.
bot_token = "123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"

[web]
# The admin UI binds here. Keep it on loopback unless you know what you are doing.
bind = "127.0.0.1:8788"
# Mount all web routes under a path such as "/archive". The proxy should preserve it.
base_path = ""
# Password for the admin UI. `nujijushi init` generates one if this file is created by nujijushi.
token = "change-me-to-a-long-random-string"

[import]
# External helpers. `nujijushi doctor` verifies both.
gallery_dl = "gallery-dl"
# Use "native" for Pixiv artwork and creator watches.
# For signed-in access, export PHPSESSID in Netscape format to cookies/pixiv.txt.
pixiv_backend = "gallery-dl"
# Use "native" for signed-in individual X posts.
# Export auth_token and ct0 from x.com to cookies/twitter.txt in Netscape format.
twitter_backend = "gallery-dl"
ffmpeg = "ffmpeg"
# Hard limit for one gallery-dl run, native post import, or native Pixiv feed scan.
timeout_secs = 1800
# Parallel imports (web UI / worker).
max_concurrent = 2
# When the bot cannot read a t.me post, scrape its public embed page instead
# (single image, reduced resolution, marked "public embed (degraded)").
public_telegram_fallback = true

[tag_suggestions]
# Optional FoidFinder server listening on 127.0.0.1.
enabled = false
tagger_port = 8790
# Allow catalog-only Danbooru queries for unresolved character-to-franchise matches.
online_fallback = false

[bot]
# Telegram command interface (started by `nujijushi run`; `--no-bot` disables it per run).
enabled = true
# DM configured admins about empty queues and unconfirmed sends.
queue_alerts = false
guest_reputation = false  # score guest submissions and require admin review before guests queue new posts
# polling: ask Telegram for updates (works anywhere, no public address needed).
# webhook: Telegram POSTs to /tg/webhook under the web base path; needs a public HTTPS URL
#          (put a TLS proxy in front of [web] bind) and reaches it with a secret header.
#          Telegram only delivers to 443, 80, 88 or 8443 - behind CGNAT or an ISP that
#          filters them, keep polling: it needs no inbound port.
mode = "polling"
poll_timeout_secs = 30
# webhook_url = "https://bot.example.com"
# webhook_secret = "generated and stored in the database when left empty"

[access]
# Telegram user ids allowed to administer the bot. Find yours with /whoami in the chat.
admins = []
# Extra ids allowed in as guests (they are auto-registered on first contact anyway).
guests = []
# false: only the ids above may use the bot. true: anyone may, as a limited guest.
public = false
allow_import = true       # guests may send links / forward posts
allow_browse = false      # /ls, /show, /queue, /channels
allow_queue = false       # /push (queues only - never publishes)
allow_publish = false     # /publish is a second switch on top of being an admin
allow_curate = false      # /approve, /reject, /nsfw, /rate, /tag
allow_nsfw_browse = false # let guests see NSFW posts in /ls
import_quota_per_day = 20
queue_quota_per_day = 20

[limits]
# Telegram caption limit; nujijushi clips and closes tags to fit.
caption_chars = 1024
# General upload limit in bytes. Fit to Telegram uses at most 10,000,000 bytes for photos.
max_upload_bytes = 52428800

[proxy]
# Optional proxy for Telegram, WebDAV, the public Telegram embed fallback, and Danbooru lookups.
# gallery-dl receives the configured URL via --proxy.
# url = "socks5h://127.0.0.1:1080"
# no_proxy = "localhost,127.0.0.1,.lan"

[storage]
# Queue new imports for the enabled sinks. `nujijushi storage sync` backfills the archive.
on_import = true
# Optional subfolder for local and WebDAV mirrors.
root = ""

